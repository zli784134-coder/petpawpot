<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/logo-paw-pot_afc0b759.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Solve the pet fresh feeding problem with AI guidance, smart recipes, and one-touch cooking. Real ingredients, sustainable fresh feeding."
    />
    <!-- 基线 OG 标签：供不执行 JS 的社交爬虫使用；具体页面由 Seo 组件在运行时覆盖 -->
    <meta property="og:site_name" content="PetPawPot" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="PetPawPot — Fresh Meal Maker for Dogs" />
    <meta
      property="og:description"
      content="Solve the pet fresh feeding problem with AI guidance, smart recipes, and one-touch cooking."
    />
    <meta property="og:image" content="/images/hero-kitchen-scene_35de91ab.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>PetPawPot — Fresh Meal Maker for Dogs</title>
    <!-- Google Analytics 4：静态注入，预渲染页也带上，不依赖 React 水合。
         本地开发（localhost/127.0.0.1）不上报，避免污染正式媒体资源。
         SPA 路由切换的 page_view 由 src/components/Analytics.tsx 负责补发。 -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      if (!/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname)) {
        gtag('js', new Date());
        gtag('config', 'G-KHH6CLBRVP');
        var gaScript = document.createElement('script');
        gaScript.async = true;
        gaScript.src = 'https://www.googletagmanager.com/gtag/js?id=G-KHH6CLBRVP';
        document.head.appendChild(gaScript);
      }
    </script>
  </head>
  <body>
    <!-- Netlify Forms 构建期检测用的隐藏表单（React SPA 需要静态副本才能被识别） -->
    <form name="newsletter" netlify netlify-honeypot="bot-field" hidden>
      <input type="email" name="email" />
      <input name="bot-field" />
    </form>
    <!-- B2B 合作询盘表单静态副本，字段须与 src/pages/Partners.tsx 中一致 -->
    <form name="partner-inquiry" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="company" />
      <input type="text" name="contact" />
      <input type="email" name="email" />
      <input type="text" name="country" />
      <select name="partnershipType">
        <option value="retailer"></option>
        <option value="distributor"></option>
        <option value="veterinary"></option>
        <option value="other"></option>
      </select>
      <textarea name="message"></textarea>
      <input name="bot-field" />
    </form>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
